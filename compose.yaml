# Optional local stack. Redis is not included (ADR 0006).
# Usage: docker compose up postgres
# Then: set DATABASE_URL=postgresql+asyncpg://ilka:ilka_dev_only@localhost:5432/ilka

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ilka
      POSTGRES_PASSWORD: ilka_dev_only
      POSTGRES_DB: ilka
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilka -d ilka"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ilka_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://ilka:ilka_dev_only@postgres:5432/ilka
      API_CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ilka_pgdata:
